name: My first flow
on: [push, workflow_dispatch]
jobs:
  my-first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all files
        run: ls -a

      - name: Print Working Directory
        run: pwd

      - name: Check the CPU
        run: nproc

      - name: Check the RAM
        run: free -h

      - name: Create JS file
        run: echo 'console.log("Hello World!")'; > app.js

      - name: List all files
        run: ls -a

      - name: Run Node.js File
        run: node app.js

  my-second-job:
    runs-on: ubuntu-latest
    needs: my-first-job
    steps:
      - name: Print all System information
        run: |
          lsb_releaase -a
          uname -r
          lscpu
          nproc
          free -h
          lsblk
      - name: Print Node.js Version
        run: node -V
      - name: Print all files
        run: ls -a
